<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>センター南校 登校スタンプラリー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'M PLUS Rounded 1c', sans-serif; }
        .calendar-day { transition: all 0.3s ease; }
        .calendar-day.checked { background-color: #fef08a; color: #b45309; font-weight: 800; border-radius: 50%; position: relative; }
        .calendar-day.checked::after { content: '✔'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.5em; color: #f59e0b; }
        .calendar-day.today { border: 2px solid #3b82f6; }
        .btn-shine { position: relative; overflow: hidden; }
        .btn-shine::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: rgba(255, 255, 255, 0.4); transform: rotate(45deg); transition: all 0.5s ease; opacity: 0; }
        .btn-shine:hover::after { left: 100%; opacity: 1; transition: all 0.5s ease; }
        .select-arrow { pointer-events: none; position: absolute; inset-y: 0; right: 0; display: flex; align-items: center; padding-right: 0.75rem; color: #374151; }
    </style>
</head>
<body class="bg-blue-50 flex items-center justify-center min-h-screen">

    <div id="app-container" class="w-full max-w-md mx-auto bg-white rounded-2xl shadow-xl p-8">
        <div id="login-screen">
            <h1 class="text-3xl font-extrabold text-center text-blue-600 mb-2 leading-tight">センター南校<br>登校スタンプラリー</h1>
            <p class="text-center text-gray-500 mb-8">IDとパスワードでログインしてね！</p>
            <div class="space-y-4">
                <input type="text" id="username" placeholder="ID" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-blue-500 transition-colors">
                <input type="password" id="password" placeholder="パスワード" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-blue-500 transition-colors">
            </div>
            <button onclick="login()" class="w-full mt-8 bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition-all duration-300 transform hover:scale-105 btn-shine">ログイン</button>
            <p id="login-error" class="text-red-500 text-center mt-4 h-5"></p>
        </div>

        <div id="main-screen" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <div><h2 class="text-2xl font-bold text-gray-800">こんにちは、<span id="user-name"></span> さん！</h2><p class="text-gray-500">今日もがんばろう！</p></div>
                <button onclick="logout()" class="text-sm text-gray-500 hover:text-red-500 transition-colors">ログアウト</button>
            </div>
            
            <div class="bg-blue-100 rounded-lg p-4 text-center mb-6">
                <p class="text-blue-800 text-sm">合計登校日数</p>
                <p class="text-3xl font-extrabold text-blue-600"><span id="login-count">0</span> 日</p>
            </div>

            <div id="announcements-container" class="space-y-3 mb-6">
            </div>

            <div id="calendar" class="bg-gray-50 p-4 rounded-lg mb-8">
                <div class="flex justify-between items-center mb-4"><button id="prev-month" class="text-gray-600 hover:text-blue-500">&lt;</button><h3 id="calendar-header" class="text-lg font-bold text-gray-700"></h3><button id="next-month" class="text-gray-600 hover:text-blue-500">&gt;</button></div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center"></div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-4">
                <button id="toko-btn" onclick="recordAttendance('toko')" class="bg-green-500 text-white font-bold py-4 rounded-lg hover:bg-green-600 transition-all duration-300 transform hover:scale-105 btn-shine disabled:opacity-50 disabled:cursor-not-allowed">登校する</button>
                <button id="geko-btn" onclick="recordAttendance('geko')" class="bg-orange-500 text-white font-bold py-4 rounded-lg hover:bg-orange-600 transition-all duration-300 transform hover:scale-105 btn-shine disabled:opacity-50 disabled:cursor-not-allowed">下校する</button>
            </div>
            
            <div class="mt-2 mb-8">
                <button id="study-plus-link" class="block w-full bg-indigo-500 text-white font-bold py-3 rounded-lg text-center hover:bg-indigo-600 transition-all duration-300 transform hover:scale-105 btn-shine">
                    Study Plusはこちら
                </button>
            </div>

            <div class="border-t-2 border-gray-100 pt-6">
                <button onclick="openEmergencyModal()" class="w-full bg-red-500 text-white font-bold py-3 rounded-lg hover:bg-red-600 transition-all duration-300 shadow-md">
                    🚨 緊急連絡
                </button>
                <p class="text-xs text-gray-500 text-center mt-2">無人開館時のトラブルの際などにご活用ください</p>
            </div>

            <div id="next-visit-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-60 flex items-center justify-center z-50 px-4">
                <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm transform transition-all scale-100 max-h-[90vh] overflow-y-auto">
                    <h3 class="text-xl font-bold text-gray-800 mb-4 text-center">お疲れ様でした！👋</h3>
                    <p class="text-gray-600 mb-4 text-sm text-center">次回の登校予定を教えてね<br><span class="text-xs text-blue-500">※明日以降の日付を選択してください</span></p>
                    
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-bold mb-2">日時選択</label>
                        
                        <div class="mb-3">
                            <input type="date" id="next-visit-date" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 bg-gray-50 text-lg">
                        </div>

                        <div class="flex space-x-2">
                            <div class="relative w-1/2">
                                <select id="next-visit-hour" class="w-full appearance-none px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 bg-gray-50 text-lg text-center">
                                    </select>
                                <div class="select-arrow"><svg class="fill-current h-4 w-4" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg></div>
                            </div>
                            <div class="flex items-center text-lg font-bold text-gray-500">:</div>
                            <div class="relative w-1/2">
                                <select id="next-visit-minute" class="w-full appearance-none px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 bg-gray-50 text-lg text-center">
                                    <option value="00">00</option>
                                    <option value="10">10</option>
                                    <option value="20">20</option>
                                    <option value="30">30</option>
                                    <option value="40">40</option>
                                    <option value="50">50</option>
                                </select>
                                <div class="select-arrow"><svg class="fill-current h-4 w-4" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg></div>
                            </div>
                        </div>
                    </div>

                    <div class="flex space-x-3 mb-4">
                        <button onclick="closeNextVisitModal()" class="flex-1 bg-gray-200 text-gray-700 font-bold py-3 rounded-lg hover:bg-gray-300 transition-colors">キャンセル</button>
                        <button onclick="submitNextVisit()" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 shadow-md transition-transform transform hover:scale-105">決定して下校</button>
                    </div>

                    <div class="border-t pt-4">
                        <button onclick="submitLineLater()" class="block w-full bg-green-500 text-white font-bold py-3 rounded-lg hover:bg-green-600 shadow-md transition-transform transform hover:scale-105 btn-shine text-sm leading-tight">
                            いつ来れるかわからないので<br>あとでLINEで送る
                        </button>
                    </div>
                </div>
            </div>

            <div id="emergency-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-60 flex items-center justify-center z-50 px-4">
                <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm transform transition-all scale-100">
                    <h3 class="text-xl font-bold text-red-600 mb-2 text-center">🚨 緊急連絡</h3>
                    <p class="text-gray-600 mb-4 text-sm text-center">スタッフに通知を送ります。<br>要件を入力してください。</p>
                    
                    <div class="mb-6">
                        <textarea id="emergency-detail" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-red-500 bg-gray-50" placeholder="例：鍵が開いていません、コピー機が詰まりました、など"></textarea>
                    </div>

                    <div class="flex space-x-3">
                        <button onclick="closeEmergencyModal()" class="flex-1 bg-gray-200 text-gray-700 font-bold py-3 rounded-lg hover:bg-gray-300 transition-colors">キャンセル</button>
                        <button onclick="submitEmergency()" class="flex-1 bg-red-600 text-white font-bold py-3 rounded-lg hover:bg-red-700 shadow-md transition-transform transform hover:scale-105">送信する</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbw9Uzp2tnUKpLxUv_8MOBT6cffjCMO91yXL1F3WSRK44DN3BCBY0YiCxpdfrWIgKWOT/exec'; 
        const STUDY_PLUS_BASE_URL = 'https://fs-platform.studyplus.co.jp/auth/student?redirect_uri=https%3A%2F%2Fcontents.studyplus.co.jp%2Fenter_exit%2F6dccd60b94&fallback_uri=https%3A%2F%2Fcontents.studyplus.co.jp%2Faccess_error&expires_at=2025-08-10T09%3A10%3A58.934Z';

        const STORAGE_KEY = 'stamp_rally_user_v1';
        // センター南校（第2フローリッシュビル）
        const SCHOOL_LAT = 35.5462481;
        const SCHOOL_LNG = 139.5737649;
        const ALLOWED_DISTANCE_M = 150; 
        const CACHE_VALID_MS = 60000; 

        let currentUser = null;
        
        let currentUser = null;
        let currentMonth = new Date();
        let attendanceDates = [];
        let hasLeftToday = false;
        let lastCheckedDate = null;
        let loginExpiryTimestamp = null;
        let expiryTimer = null;

        let cachedPosition = null;
        let isLocationReady = false;

        const loginScreen = document.getElementById('login-screen');
        const mainScreen = document.getElementById('main-screen');
        const loginError = document.getElementById('login-error');
        const userNameEl = document.getElementById('user-name');
        const loginCountEl = document.getElementById('login-count');
        const tokoBtn = document.getElementById('toko-btn');
        const gekoBtn = document.getElementById('geko-btn');
        const studyPlusLinkBtn = document.getElementById('study-plus-link');
        
        const nextVisitModal = document.getElementById('next-visit-modal');
        const nextVisitDateInput = document.getElementById('next-visit-date');
        const nextVisitHourSelect = document.getElementById('next-visit-hour');
        const nextVisitMinuteSelect = document.getElementById('next-visit-minute');

        const emergencyModal = document.getElementById('emergency-modal');
        const emergencyDetail = document.getElementById('emergency-detail');

        window.addEventListener('load', () => {
            // ★追加: 時間プルダウンの生成 (7時〜22時)
            populateHours();

            const urlParams = new URLSearchParams(window.location.search);
            const qrLoginDataStr = urlParams.get('qr_login_data');

            if (qrLoginDataStr) {
                try {
                    const decodedData = decodeURIComponent(qrLoginDataStr);
                    const result = JSON.parse(decodedData);
                    showMainScreen(result, false); 
                    window.history.replaceState(null, '', window.location.pathname);
                    return;
                } catch (e) {
                    console.error("QRログインデータの解析に失敗しました。", e);
                    loginError.textContent = "QRコードのログイン情報が正しくありません。";
                }
            }

            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                try {
                    const parsedData = JSON.parse(savedData);
                    const now = new Date().getTime();
                    if (parsedData.expiryTimestamp && now < parsedData.expiryTimestamp) {
                        console.log("★ 自動ログイン成功 (Cache Hit)");
                        showMainScreen(parsedData, true);
                        return;
                    } else {
                        console.log("セッション期限切れのため自動ログインスキップ");
                        localStorage.removeItem(STORAGE_KEY);
                    }
                } catch (e) {
                    console.error("保存データの読み込み失敗", e);
                    localStorage.removeItem(STORAGE_KEY);
                }
            }
        });

        // ★変更: 7時から22時までの選択肢を作る
        function populateHours() {
            nextVisitHourSelect.innerHTML = '';
            for (let i = 7; i <= 22; i++) { // 7時から開始
                const opt = document.createElement('option');
                opt.value = String(i).padStart(2, '0');
                opt.textContent = i + '時';
                if(i === 17) opt.selected = true; // デフォルト17時
                nextVisitHourSelect.appendChild(opt);
            }
        }

        function getDistance(lat1, lng1, lat2, lng2) {
            const R = 6371e3; 
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lng2-lng1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // ★ここから追加：位置情報関連ユーティリティとフォールバックエンジン
        function getPosition(options) {
            return new Promise((resolve, reject) => {
                navigator.geolocation.getCurrentPosition(resolve, reject, options);
            });
        }

        async function getLocationWithFallback(btn) {
            const now = Date.now();

            // 1. 新鮮なキャッシュがあれば即座に返す
            if (cachedPosition && isLocationReady && (now - cachedPosition.timestamp < CACHE_VALID_MS)) {
                console.log("新鮮なキャッシュを利用します");
                return cachedPosition;
            }

            // 2. 高精度で試行
            try {
                if (btn) btn.textContent = "GPSを検索中...";
                const pos = await getPosition({ enableHighAccuracy: true, timeout: 5000, maximumAge: 0 });
                cachedPosition = { coords: pos.coords, timestamp: Date.now() }; 
                isLocationReady = true;
                return cachedPosition;
            } catch (error) {
                console.warn("高精度での取得失敗、Wi-Fi/基地局ベースに切り替えます:", error.message);
                
                // 3. 低精度でフォールバック試行
                try {
                    if (btn) btn.textContent = "屋内電波を探しています...";
                    const fallbackPos = await getPosition({ enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 });
                    cachedPosition = { coords: fallbackPos.coords, timestamp: Date.now() };
                    isLocationReady = true;
                    return cachedPosition;
                } catch (fallbackError) {
                    console.error("低精度での取得も失敗:", fallbackError.message);
                    throw fallbackError; 
                }
            }
        }
        // ★追加ここまで
        
        // ★元の startLocationTracking() をこれに上書きする
        function startLocationTracking() {
            if (!navigator.geolocation) {
                console.warn("位置情報非対応端末です");
                return;
            }
            console.log("位置情報の監視(Preload)を開始します...");
            navigator.geolocation.watchPosition(
                (position) => {
                    cachedPosition = { coords: position.coords, timestamp: Date.now() };
                    isLocationReady = true;
                },
                (error) => {
                    console.warn("バックグラウンド取得エラー(無視して進行可):", error.code);
                },
                { enableHighAccuracy: false, timeout: 20000, maximumAge: 60000 }
            );
        }

        function showMainScreen(result, isCache = false) {
            currentUser = result.user;
            attendanceDates = result.attendanceDates || [];
            hasLeftToday = result.hasLeftToday || false;
            
            userNameEl.textContent = currentUser.name;
            loginCountEl.textContent = attendanceDates.length;
            
            loginScreen.classList.add('hidden');
            mainScreen.classList.remove('hidden');
            
            const announcementsContainer = document.getElementById('announcements-container');
            announcementsContainer.innerHTML = ''; 
            if (result.announcements && result.announcements.length > 0) {
                let announcementsHtml = '<h3 class="text-xl font-bold text-gray-800 border-b-2 pb-2 mb-2">📢 お知らせ</h3>';
                result.announcements.forEach(ann => {
                    const safeTitle = ann.title.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    const safeContent = ann.content.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    announcementsHtml += `<div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded-r-lg shadow-sm"><h4 class="font-bold text-yellow-900">${safeTitle}</h4><p class="text-gray-700 mt-1 text-sm">${safeContent}</p></div>`;
                });
                announcementsContainer.innerHTML = announcementsHtml;
            }
            
            lastCheckedDate = new Date().toLocaleDateString();

            if (result.expiryTimestamp) { 
                loginExpiryTimestamp = result.expiryTimestamp;
                startExpiryTimer();
            }

            if (!isCache) {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(result));
                } catch(e) { console.error("Storage save error", e); }
            }

            startLocationTracking();

            updateCalendar();
            updateButtonState();
            loginError.textContent = '';
        }

        function startExpiryTimer() {
            if (expiryTimer) clearInterval(expiryTimer);
            expiryTimer = setInterval(() => {
                if (!loginExpiryTimestamp) {
                    clearInterval(expiryTimer);
                    return;
                }
                const now = new Date().getTime();
                if (now > loginExpiryTimestamp) {
                    alert("セッションの有効期限が切れました。再度ログインしてください。");
                    logout();
                }
            }, 1000);
        }
        
        function checkDateAndLogout() {
            if (!currentUser) return;
            const today = new Date().toLocaleDateString();
            if (lastCheckedDate === null) lastCheckedDate = today;
            if (lastCheckedDate !== today) {
                alert("日付が変わりました。再度ログインしてください。");
                logout();
            }
        }
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                checkDateAndLogout();
            }
        });

        function logout() {
            if (expiryTimer) clearInterval(expiryTimer);
            loginExpiryTimestamp = null;
            currentUser = null;
            attendanceDates = [];
            hasLeftToday = false;
            
            localStorage.removeItem(STORAGE_KEY);
            cachedPosition = null;
            isLocationReady = false;

            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            mainScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
        }

        function generateDynamicStudyPlusUrl() {
            const originalUrl = new URL(STUDY_PLUS_BASE_URL);
            originalUrl.searchParams.delete('expires_at'); 
            const baseUrlWithoutOldExpiry = originalUrl.toString();
            const now = new Date();
            now.setMinutes(now.getMinutes() + 5);
            const newExpiresAt = now.toISOString();
            return `${baseUrlWithoutOldExpiry}&expires_at=${encodeURIComponent(newExpiresAt)}`;
        }

        function redirectToStudyPlus() {
            const urlToOpen = generateDynamicStudyPlusUrl();
            window.open(urlToOpen, '_blank');
        }

        function jsonpRequest(url, callbackName, callback) {
            window[callbackName] = callback;
            const script = document.createElement('script');
            script.src = url;
            document.body.appendChild(script);
            script.onload = () => { document.body.removeChild(script); delete window[callbackName]; };
            script.onerror = () => { 
                loginError.textContent = '通信エラーが発生しました。'; 
                document.body.removeChild(script); 
                delete window[callbackName]; 
            };
        }

        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            loginError.textContent = 'ログイン中...';
            if (!username || !password) { loginError.textContent = 'IDとパスワードを入力してください。'; return; }
            const callbackName = 'loginCallback';
            const url = `${GAS_URL}?action=login&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&callback=${callbackName}`;
            jsonpRequest(url, callbackName, (result) => {
                if (result.success) {
                    showMainScreen(result, false); 
                } else {
                    loginError.textContent = result.message || 'ログインに失敗しました。';
                }
            });
        }

        // ★元の recordAttendance(type) をこれに上書きする
        async function recordAttendance(type) {
            const btn = type === 'toko' ? tokoBtn : gekoBtn;
            
            if (!navigator.geolocation) {
                alert("お使いの端末は位置情報に対応していません。");
                return;
            }

            btn.disabled = true;
            const originalText = btn.textContent;

            try {
                const position = await getLocationWithFallback(btn);
                btn.textContent = originalText;
                checkDistanceAndExecute(position, type, btn);
            } catch (error) {
                alert("位置情報が取得できませんでした。\n\n【対策】\n1. 端末の「位置情報（GPS）」がオンか確認\n2. ブラウザの位置情報許可がオンか確認\n3. Wi-Fiをオンにすると屋内の精度が上がります");
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }

        function checkDistanceAndExecute(position, type, btn) {
            const currentLat = position.coords.latitude;
            const currentLng = position.coords.longitude;
            const distance = getDistance(currentLat, currentLng, SCHOOL_LAT, SCHOOL_LNG);

            console.log(`教室までの距離: 約${Math.round(distance)}m`);

            if (distance <= ALLOWED_DISTANCE_M) {
                if (type === 'geko') {
                    // 下校時：モーダル準備
                    const now = new Date();
                    const tomorrow = new Date(now);
                    tomorrow.setDate(tomorrow.getDate() + 1);
                    
                    // YYYY-MM-DD 形式を取得
                    const tomorrowStr = tomorrow.getFullYear() + '-' + 
                                        String(tomorrow.getMonth() + 1).padStart(2, '0') + '-' + 
                                        String(tomorrow.getDate()).padStart(2, '0');
                    
                    nextVisitDateInput.min = tomorrowStr;
                    nextVisitDateInput.value = ""; // リセット
                    nextVisitModal.classList.remove('hidden');
                } else {
                    executeAttendance('toko', null);
                }
            } else {
                alert(`教室から離れています（約${Math.round(distance)}m）。\n教室の中で押してください。\n\n※位置情報がずれている場合は、Wi-Fiをオンにすると改善することがあります。`);
            }
        }

        function submitNextVisit() {
            const dateVal = nextVisitDateInput.value;
            const hourVal = nextVisitHourSelect.value;
            const minuteVal = nextVisitMinuteSelect.value;

            if (!dateVal) {
                alert("日付を選択してください。");
                return;
            }
            if (dateVal < nextVisitDateInput.min) {
                 alert("明日以降の日付を選択してください。");
                 return;
            }

            const fullDateTime = `${dateVal}T${hourVal}:${minuteVal}`;
            
            nextVisitModal.classList.add('hidden');
            executeAttendance('geko', fullDateTime);
        }

        function submitLineLater() {
            nextVisitModal.classList.add('hidden');
            executeAttendance('geko', 'LINEで連絡');
        }

        // ★元の closeNextVisitModal() をこれに上書きする
        function closeNextVisitModal() {
            nextVisitModal.classList.add('hidden');
            gekoBtn.disabled = false; // ★この1行を追加
        }

        function executeAttendance(type, nextVisitDate) {
            const button = type === 'toko' ? tokoBtn : gekoBtn;
            button.disabled = true;
            button.textContent = '記録中...'; 

            const callbackName = 'attendanceCallback';
            let url = `${GAS_URL}?action=recordAttendance&userId=${encodeURIComponent(currentUser.id)}&type=${type}&callback=${callbackName}`;
            if (nextVisitDate) {
                url += `&nextVisit=${encodeURIComponent(nextVisitDate)}`;
            }

            jsonpRequest(url, callbackName, (result) => {
                if (result.success) {
                    console.log("記録成功: ", type);
                    if (type === 'toko') {
                        attendanceDates = result.attendanceDates;
                        currentUser.attendanceDates = attendanceDates; 
                        
                        const savedData = localStorage.getItem(STORAGE_KEY);
                        if (savedData) {
                            const data = JSON.parse(savedData);
                            data.attendanceDates = result.attendanceDates;
                            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                        }
                    } else if (type === 'geko') {
                        hasLeftToday = true;
                        const savedData = localStorage.getItem(STORAGE_KEY);
                        if (savedData) {
                            const data = JSON.parse(savedData);
                            data.hasLeftToday = true;
                            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                        }
                    }
                    updateCalendar();
                    updateButtonState();
                } else {
                    console.error("記録失敗: ", result.message);
                    alert(result.message || '記録に失敗しました。');
                    button.disabled = false;
                    button.textContent = (type === 'toko' ? '登校する' : '下校する');
                }
            });

            redirectToStudyPlus();
        }

        function openEmergencyModal() {
            emergencyDetail.value = '';
            emergencyModal.classList.remove('hidden');
        }
        
        function closeEmergencyModal() {
            emergencyModal.classList.add('hidden');
        }

        function submitEmergency() {
            const detail = emergencyDetail.value;
            if (!detail) {
                alert("要件を入力してください。");
                return;
            }
            const callbackName = 'emergencyCallback';
            const url = `${GAS_URL}?action=emergency&userId=${encodeURIComponent(currentUser.id)}&detail=${encodeURIComponent(detail)}&callback=${callbackName}`;
            
            alert("緊急連絡を送信しました。\n（確認のためOKを押してください）");
            closeEmergencyModal();
            
            jsonpRequest(url, callbackName, (result) => {
                if (result.success) {
                    console.log("緊急連絡送信成功");
                } else {
                    console.error("緊急連絡送信失敗");
                }
            });
        }

        function updateButtonState() {
            const todayStr = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, '-');
            const hasAttendedToday = attendanceDates.includes(todayStr);
            tokoBtn.disabled = hasAttendedToday;
            tokoBtn.textContent = '登校する'; 
            gekoBtn.disabled = !hasAttendedToday || hasLeftToday;
            gekoBtn.textContent = '下校する'; 
        }

        function updateCalendar() {
            const calendarHeader = document.getElementById('calendar-header');
            const calendarGrid = document.getElementById('calendar-grid');
            calendarGrid.innerHTML = '';
            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            calendarHeader.textContent = `${year}年 ${month + 1}月`;
            const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
            weekdays.forEach(day => {
                const dayEl = document.createElement('div');
                dayEl.textContent = day;
                dayEl.className = 'font-bold text-sm text-gray-500';
                if (day === '日') dayEl.classList.add('text-red-500');
                if (day === '土') dayEl.classList.add('text-blue-500');
                calendarGrid.appendChild(dayEl);
            });
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            for (let i = 0; i < firstDay; i++) { calendarGrid.appendChild(document.createElement('div')); }
            for (let i = 1; i <= daysInMonth; i++) {
                const dayEl = document.createElement('div');
                dayEl.textContent = i;
                dayEl.className = 'p-2 calendar-day';
                const currentDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                if (attendanceDates.includes(currentDateStr)) { dayEl.classList.add('checked'); }
                if (year === today.getFullYear() && month === today.getMonth() && i === today.getDate()) { dayEl.classList.add('today'); }
                calendarGrid.appendChild(dayEl);
            }
        }
        
        studyPlusLinkBtn.addEventListener('click', redirectToStudyPlus);
        document.getElementById('prev-month').addEventListener('click', () => { currentMonth.setMonth(currentMonth.getMonth() - 1); updateCalendar(); });
        document.getElementById('next-month').addEventListener('click', () => { currentMonth.setMonth(currentMonth.getMonth() + 1); updateCalendar(); });
        document.getElementById('password').addEventListener('keypress', function(e) { if (e.key === 'Enter') { login(); } });
    </script>
</body>
</html>
